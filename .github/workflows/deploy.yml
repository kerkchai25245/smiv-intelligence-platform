name: Deploy production

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --tags origin
            git checkout "${{ github.ref_name }}"
            docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml up -d --build --remove-orphans
            docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"

